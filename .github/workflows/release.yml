name: Build signed release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Check repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set. Add it under Settings → Secrets and variables → Actions → Repository secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Validate keystore and secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "::notice::storePassword length=${#KEYSTORE_PASSWORD}"
          echo "::notice::keyAlias=$KEY_ALIAS"
          echo "::notice::keystore bytes=$(stat -c%s keystore/release.jks)"
          sed -e 's/^storePassword=.*/storePassword=***/' -e 's/^keyPassword=.*/keyPassword=***/' keystore.properties | while IFS= read -r line; do
            echo "::notice::properties: [$line]"
          done
          if ! keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > keytool.log 2>&1; then
            cat keytool.log
            while IFS= read -r line; do echo "::error::$line"; done < keytool.log
            exit 1
          fi
          cat keytool.log

      - name: Build release APK
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log; then
            echo "::error::Gradle build failed"
            grep -E "FAILURE:|What went wrong|Keystore|error:|Caused by|Execution failed" gradle-build.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done || true
            exit 1
          fi

      - name: Prepare APK
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "KurdTube-${VERSION}.apk"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs KurdTube-*.apk

      - name: Prepare checksum and release body
        run: |
          APK=$(ls KurdTube-*.apk)
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$HASH  $(basename "$APK")" > "${APK}.sha256"
          cat RELEASE_NOTES_1.1.8.md > release_body.md
          printf '\n## SHA-256\n\n```\n%s\n```\n' "$HASH" >> release_body.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KurdTube-release-apk
          path: |
            KurdTube-*.apk
            KurdTube-*.apk.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            KurdTube-*.apk
            KurdTube-*.apk.sha256
