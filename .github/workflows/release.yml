name: Build signed release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Add optional Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written from GOOGLE_SERVICES_JSON."
          else
            echo "No GOOGLE_SERVICES_JSON secret; release is built without Firebase Analytics."
          fi

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings → Secrets and variables → Actions → Repository secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk "KurdTube-${VERSION}.apk"

      - name: Verify APK signature and version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs KurdTube-*.apk | tee apksigner.log
          # SHA-256 fingerprint of the existing KurdTube release certificate.
          # Update this line if the project is signed with a different keystore.
          grep -qi "f217c67e4da797edfe2d4fe9bd489449325d912648727ec038fc0b59a16a8753" apksigner.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging KurdTube-*.apk | grep -q "package: name='com.techno.kurdtube' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"

      - name: Prepare checksum and release body
        run: |
          APK=$(ls KurdTube-*.apk)
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$HASH  $(basename "$APK")" > "${APK}.sha256"
          NOTES="RELEASE_NOTES_${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="RELEASE_NOTES.md"
          fi
          if [ -f "$NOTES" ]; then
            cat "$NOTES" > release_body.md
          else
            echo "# KurdTube ${VERSION}" > release_body.md
          fi
          printf '\n## SHA-256\n\n```\n%s\n```\n' "$HASH" >> release_body.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KurdTube-release-apk
          path: |
            KurdTube-*.apk
            KurdTube-*.apk.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: KurdTube ${{ steps.version.outputs.name }}
          body_path: release_body.md
          files: |
            KurdTube-*.apk
            KurdTube-*.apk.sha256
