plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {

    namespace "com.techno.kurdtube"

    compileSdk 33

    defaultConfig {
        applicationId namespace
        minSdk 25
        targetSdk 33
        versionCode 3
        versionName "1.1.5"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.3.2"
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

}

dependencies {

    implementation "androidx.activity:activity-compose:1.6.1"

    implementation "androidx.core:core-splashscreen:1.0.0"

    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1"

    implementation 'androidx.compose.ui:ui:1.3.0'

    implementation "androidx.compose.material3:material3:1.0.1"

    implementation "androidx.media3:media3-exoplayer:1.0.0-beta03"
    implementation "androidx.media3:media3-session:1.0.0-beta03"

    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.28.0'
    implementation 'com.google.accompanist:accompanist-pager:0.28.0'

    implementation "androidx.webkit:webkit:1.6.0"

    //native LAME encoder, used to turn the downloaded YouTube stream into an MP3 file
    implementation('com.github.naman14:TAndroidLame:1.1') {
        //the wrapper is old and still declares the pre-AndroidX support library, which
        //would duplicate the androidx classes; only the native encoder is needed
        exclude group: 'com.android.support'
    }

}