plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {

    namespace "com.techno.kurdtube"

    compileSdk 35

    defaultConfig {
        applicationId namespace
        minSdk 25
        // Android 16 (API 36) Play Protect blocks/warns when targetSdk is more
        // than 2 levels below the device API; keep this at 35+.
        targetSdk 35
        versionCode 3
        versionName "1.1.5"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Pin the release version explicitly so the release APK can never
            // inherit a different version from a flavor/override.
            versionCode 3
            versionName "1.1.5"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose = true
    }

    composeOptions {
        // Compose Compiler for Kotlin 1.9.24
        kotlinCompilerExtensionVersion "1.5.14"
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

}

dependencies {

    implementation "androidx.activity:activity-compose:1.9.0"

    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"

    // Compose BOM keeps ui / foundation / material3 versions aligned
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"

    implementation "androidx.media3:media3-exoplayer:1.0.0-beta03"
    implementation "androidx.media3:media3-session:1.0.0-beta03"

    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.34.0'

    implementation "androidx.webkit:webkit:1.6.0"

    //native LAME encoder, used to turn the downloaded YouTube stream into an MP3 file
    implementation('com.github.naman14:TAndroidLame:1.1') {
        //the wrapper is old and still declares the pre-AndroidX support library, which
        //would duplicate the androidx classes; only the native encoder is needed
        exclude group: 'com.android.support'
    }

}