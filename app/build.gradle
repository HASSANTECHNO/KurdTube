plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Google Services (Firebase) plugin is applied at the bottom of this
    // file, and only when app/google-services.json exists, so the project also
    // builds without a Firebase configuration.
}

// Release signing is configured from keystore.properties, which is intentionally
// not committed. GitHub Actions creates it from repository secrets.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    namespace "com.techno.kurdtube"

    compileSdk 35

    defaultConfig {
        applicationId namespace
        minSdk 25
        // Android 16 (API 36) Play Protect blocks/warns when targetSdk is more
        // than 2 levels below the device API; keep this at 35+.
        targetSdk 35
        versionCode 120
        versionName "1.2"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose = true
        // AnalyticsManager reads BuildConfig.VERSION_NAME for the app_start event.
        buildConfig = true
    }

    testOptions {
        // Android framework methods (android.util.Log, ...) have no implementation
        // in plain JVM unit tests; return the default value instead of throwing.
        unitTests.returnDefaultValues = true
    }

    composeOptions {
        // Compose Compiler for Kotlin 1.9.24
        kotlinCompilerExtensionVersion "1.5.14"
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

}

dependencies {

    // Firebase Analytics: anonymous, aggregate usage stats (active users,
    // screens, downloads). Requires app/google-services.json.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-analytics"

    implementation "androidx.activity:activity-compose:1.9.0"

    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"

    // Compose BOM keeps ui / foundation / material3 versions aligned
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"

    implementation "androidx.media3:media3-exoplayer:1.0.0-beta03"
    implementation "androidx.media3:media3-session:1.0.0-beta03"

    implementation 'com.google.accompanist:accompanist-systemuicontroller:0.34.0'

    implementation "androidx.webkit:webkit:1.6.0"

    //native LAME encoder, used to turn the downloaded YouTube stream into an MP3 file
    implementation('com.github.naman14:TAndroidLame:1.1') {
        //the wrapper is old and still declares the pre-AndroidX support library, which
        //would duplicate the androidx classes; only the native encoder is needed
        exclude group: 'com.android.support'
    }

    testImplementation "junit:junit:4.13.2"
    // Android's org.json classes are stubs in unit tests; use the real implementation.
    testImplementation "org.json:json:20240303"

}

// Firebase: the plugin must be applied after the Android plugin. It needs
// app/google-services.json (see FIREBASE_SETUP.md). Without that file the app
// still builds and runs, but analytics stays disabled.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
